# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: aitinerary

before:
  hooks:
    - go mod tidy

builds:
  - id: aitinerary
    main: ./cmd/aitinerary
    binary: aitinerary
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

homebrew_casks:
  - name: aitinerary
    repository:
      owner: madicen
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/madicen/aitinerary"
    description: "A BubbleTea TUI for Jira ticket hygiene"
    license: "MIT"
    binaries:
      - aitinerary
    # gh is the only hard runtime dep installable via brew; the Jira token and
    # AI backend (Ollama / cloud) are configured at runtime.
    dependencies:
      - formula: gh
    # Unsigned GitHub release binaries are quarantined on macOS. Quarantine
    # alone is not enough on recent macOS: Gatekeeper SIGKILLs the
    # linker/ad-hoc signature (Code Signature Invalid). Strip quarantine and
    # re-sign ad-hoc in preflight. Proper fix later: Developer ID + notarization.
    caveats: |
      On macOS, if Gatekeeper blocks a GitHub/direct download ("Not Opened" /
      Code Signature Invalid), clear quarantine and re-sign ad-hoc:

        xattr -dr com.apple.quarantine "$(which aitinerary)"
        codesign --force --sign - "$(which aitinerary)"

      Or use System Settings → Privacy & Security → Open Anyway.
      Prefer `brew install --cask madicen/tap/aitinerary` (cask preflight handles this).
    hooks:
      pre:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/aitinerary"]
            run "/usr/bin/codesign", args: ["--force", "--sign", "-", "{{ .StagedPath }}/aitinerary"]
          end

release:
  github:
    owner: madicen
    name: aitinerary
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
